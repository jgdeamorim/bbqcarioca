<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | BBQ do Carioca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      background-color: #0c0908;
      color: #f7f4ee;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 30%, rgba(255, 107, 53, 0.12) 0%, transparent 60%);
    }
    .error-card {
      max-width: 520px;
      padding: 48px 32px;
      background: rgba(22, 17, 15, 0.8);
      border: 1px solid rgba(255, 107, 53, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
    }
    .error-code {
      font-family: 'Fraunces', serif;
      font-size: 5rem;
      font-weight: 800;
      color: #ff6b35;
      margin: 0 0 8px 0;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 107, 53, 0.4);
    }
    .error-title {
      font-family: 'Fraunces', serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 16px 0;
      color: #f7f4ee;
    }
    .error-desc {
      font-size: 1rem;
      color: #c4b9aa;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(135deg, #ff6b35 0%, #d84315 100%);
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 50px;
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 107, 53, 0.5);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found / Página Não Encontrada</h1>
    <p class="error-desc">
      Looks like this page went off the grill! Let's get you back to the authentic Brazilian churrasco experience.<br><br>
      Parece que esta página saiu da grelha! Vamos levar você de volta ao melhor churrasco brasileiro na Flórida.
    </p>
    <a href="/" class="btn-home">Return to Home / Voltar ao Início</a>
  </div>
</body>
</html>
